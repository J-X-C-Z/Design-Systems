<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlatVector · Six colorful studies</title><link rel="stylesheet" href="bundle.css"><style>body{margin:0;background:#2b2bff}.poster{max-width:1200px;margin:auto;min-height:100vh;padding:48px;box-sizing:border-box}.poster header{position:relative;padding:24px 0 48px}.poster h1{font-size:clamp(64px,11vw,132px);line-height:1;letter-spacing:-.065em;margin:24px 0;font-weight:850;color:var(--fv-blue)}.poster[data-mode=dark] h1{color:var(--fv-mint)}.poster h1 span{display:block;font-size:22px;letter-spacing:-.02em;color:var(--fv-text);margin-top:24px}.poster header p,.poster small{font:700 12px ui-monospace,monospace;letter-spacing:.08em}.poster .color-story{position:absolute;right:24px;bottom:48px;display:flex;align-items:flex-end;gap:8px}.poster .color-story i{width:96px;height:96px;background:var(--fv-coral);border-radius:50%}.poster .color-story b{width:48px;height:120px;background:var(--fv-yellow);border-radius:24px 24px 0 0}.poster .color-story em{width:72px;height:72px;background:var(--fv-mint);border-radius:0 72px 0 0}.poster nav{display:flex;gap:12px;padding:24px 0}.poster main{display:grid;grid-template-columns:1fr 1fr;gap:24px}.poster section{padding:32px;border-radius:24px;background:var(--fv-quiet);min-width:0}.poster section:last-child{grid-column:1/-1;background:var(--fv-surface);padding-left:0}.poster h2{font-size:26px;margin:12px 0 24px;line-height:1.2;letter-spacing:-.025em}.poster button{border:0;border-radius:999px;background:var(--fv-blue);color:var(--fv-cream);padding:12px 20px;font:700 14px system-ui,sans-serif;cursor:pointer}.poster button:focus-visible{outline:3px solid var(--fv-focus);outline-offset:3px}.poster .actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.poster footer{padding:24px 0;font:12px ui-monospace,monospace}.poster output{font-size:14px}.poster form>p{font-size:12px}@media(max-width:600px){.p
