<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora · Six component studies</title><link rel="stylesheet" href="bundle.css"><style>body{margin:0;background:#080717}.poster{max-width:1200px;margin:auto;min-height:100vh;padding:64px;box-sizing:border-box}.poster header{position:relative;padding:32px 0 64px;border-bottom:1px solid var(--ag-edge)}.poster h1{font-size:clamp(60px,10vw,120px);line-height:1;letter-spacing:-.055em;margin:24px 0;font-weight:300}.poster h1 span{display:block;font-size:18px;letter-spacing:.1em;font-weight:400;margin-top:24px}.poster header p,.poster small{font:12px ui-monospace,monospace;letter-spacing:.12em;color:var(--ag-muted)}.poster .lens-study{position:absolute;right:0;bottom:48px;width:120px;height:120px;border:1px solid #fff8;border-radius:50%;background:linear-gradient(130deg,#cdbaff44,#fff1 45%,#88e8ef44);box-shadow:inset 4px 1px 5px #fff5,inset -4px -2px 6px #796eff66,0 20px 40px #0004;backdrop-filter:blur(12px)}.poster nav{display:flex;gap:12px;padding:32px 0}.poster main{display:grid;grid-template-columns:1fr 1fr;gap:24px}.poster section{padding:32px;border:1px solid #ffffff4d;border-radius:28px;background:#ffffff0d;box-shadow:inset 0 1px 0 #fff3,0 18px 48px #0002;backdrop-filter:blur(30px);min-width:0}.poster section:last-child{grid-column:1/-1}.poster h2{font-weight:500;font-size:24px;margin:12px 0 24px;line-height:1.3}.poster button{border:1px solid var(--ag-edge);border-radius:999px;background:var(--ag-solid);color:var(--ag-text);padding:10px 16px;font:inherit;cursor:pointer}.poster button:focus-visible{outline:3px solid var(--ag-focus);outline-offset:3px}.poster .actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.poster footer{padding:32px 0;font:12px ui-monospace,monospace;color:var(--ag-muted)}.poster output{font-size:14px}.poster form>p{font-size:12px;color:var(--ag-muted)}@media(max-width:600px){.poster{padding:24px}.poster main{grid-template-columns:1fr}.poster .lens-study{width:64px;height:64px;bottom:16px}.poster section{padding:24px 16px}.poster nav{flex-wrap:wrap}}@supports not(backdrop-filter:blur(1px)){.poster section{background:var(--ag-surface)}}.caption-proof{margin-top:24px;padding:24px;display:grid;grid-template-columns:32px 1fr;gap:16px;border-radius:24px;border:1px solid #ffffff4d;background:var(--ag-surface);box-shadow:inset 0 1px 0 #ffffff26;min-height:88px}.caption-proof span{color:var(--ag-focus);font-size:32px;font-weight:200}.caption-proof output{font-size:24px;font-weight:300;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;align-self:center}</style></head><body><div id="root"></div><script src="bundle.js"></script></body></html>
