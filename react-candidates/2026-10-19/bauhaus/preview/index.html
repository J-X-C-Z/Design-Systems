<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bauhaus · Six component studies</title><link rel="stylesheet" href="bundle.css"><style>body{margin:0;background:#b4ac9d}.poster{max-width:1152px;margin:auto;min-height:100vh;padding:48px;box-sizing:border-box}.poster header{position:relative;border-bottom:4px solid var(--bh-ink);padding-bottom:48px}.poster h1{font-size:clamp(48px,9vw,108px);line-height:.9;letter-spacing:-.055em;margin:36px 0 24px;font-weight:900}.poster h1 span{display:block;font-size:16px;letter-spacing:.2em;text-transform:uppercase;margin-top:24px}.poster header p,.poster small{font:12px ui-monospace,monospace;letter-spacing:.1em}.poster .composition{display:flex;gap:12px;position:absolute;right:0;bottom:24px}.poster .composition>*{width:48px;height:48px;background:var(--bh-red)}.poster .composition i{border-radius:50%}.poster .composition b{background:var(--bh-yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}.poster .composition em{background:var(--bh-blue)}.poster nav{display:flex;gap:12px;padding:24px 0}.poster main{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--bh-rule);border-left:1px solid var(--bh-rule)}.poster section{padding:24px;border-right:1px solid var(--bh-rule);border-bottom:1px solid var(--bh-rule);min-width:0}.poster section:last-child{grid-column:1/-1}.poster h2{font-size:24px;margin:12px 0 24px;line-height:1.2}.poster button{border:2px solid var(--bh-ink);background:transparent;color:inherit;padding:8px 12px;font:inherit;cursor:pointer}.poster button:focus-visible{outline:3px solid var(--bh-blue);outline-offset:3px}.poster .actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.poster footer{padding:24px 0;font:12px ui-monospace,monospace}.poster output{font-size:14px}.poster form>p{font-size:12px}@media(max-width:600px){.poster{padding:24px}.poster main{grid-template-columns:1fr}.poster .composition{position:static}.poster section{padding:24px 12px}.poster nav{flex-wrap:wrap}}.caption-proof{margin-top:24px;display:grid;grid-template-columns:48px 1fr;border-top:4px solid var(--bh-ink);padding-top:12px;gap:12px;min-height:96px}.caption-proof span{color:var(--bh-red);writing-mode:vertical-rl}.caption-proof output{font-size:24px;font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere;align-self:center}</style></head><body><div id="root"></div><script src="bundle.js"></script></body></html>
