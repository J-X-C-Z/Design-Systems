<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>候选响应式检查</title><style>body{font:14px Arial,"PingFang SC",sans-serif;background:#dfe4db;margin:0}header{padding:16px;position:relative;background:#fff;z-index:2;border-bottom:1px solid #ccc}button{font:inherit;padding:10px 15px;margin:3px;cursor:pointer}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #aab3a4;background:#fff;width:1440px;height:980px;max-width:none}p{font-size:12px;margin:8px 0;color:#55634f}</style></head><body><header>候选真实 iframe 视口：<button data-width="1440">1440px</button><button data-width="768">768px</button><button data-width="390">390px</button><button data-width="320">320px</button><strong id="size">1440 × 980</strong><p>这会改变嵌入页面的真实CSS视口宽度，不是缩小截图。宿主窗口较窄时可横向滚动。此工具不模拟物理设备、系统字体、200%浏览器缩放或操作系统减少动效设置。</p></header><main><iframe id="preview" title="平面知觉空间技术出版四页" src="index.html"></iframe></main><script>document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#preview').style.width=b.dataset.width+'px';document.querySelector('#size').textContent=b.dataset.width+' × 980'}));</script></body></html>
