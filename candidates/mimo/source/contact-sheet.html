<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四页静态构图比较</title><style>body{margin:0;background:#ddd;font:16px sans-serif}header{padding:14px}button{padding:8px;margin-right:8px}main{display:flex;gap:12px;padding:12px;align-items:start}.panel{position:relative;flex:none;overflow:hidden;background:white}iframe{border:0;width:1440px;position:absolute;left:0;top:0;transform-origin:0 0}p{font-size:13px;margin:8px 0}</style></head><body><header><button data-show="all">四页并排</button><button data-show="cover">01</button><button data-show="range">02</button><button data-show="time">03</button><button data-show="notes">04</button><p>真实1440px页面等比缩小，移除工具栏，仅比较完整静态构图。缩略图不代表实际字号、手机或打印验收。</p></header><main></main><script>let mode='all';const keys=['cover','range','time','notes'];for(const k of keys){const p=document.createElement('div');p.className='panel';p.dataset.key=k;const f=document.createElement('iframe');f.title=k+'完整静态页';f.src='index.html#'+k;f.onload=()=>{const d=f.contentDocument;d.querySelectorAll('nav,.status,.editor,.editor-footer').forEach(e=>e.style.display='none');f.dataset.height=Math.ceil(d.querySelector('#'+k).getBoundingClientRect().height);layout()};p.append(f);document.querySelector('main').append(p)}function layout(){for(const p of document.querySelectorAll('.panel')){p.hidden=mode!=='all'&&p.dataset.key!==mode;const f=p.firstChild,h=+f.dataset.height||900,s=mode==='all'?Math.min((innerWidth-72)/5760,.25):Math.min((innerWidth-24)/1440,(innerHeight-120)/h);p.style.width=1440*s+'px';p.style.height=h*s+'px';f.style.height=h+'px';f.style.transform='scale('+s+')'}}document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{mode=b.dataset.show;layout()});onresize=layout;</script></body></html>
